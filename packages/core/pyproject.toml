[project]
name = "club-calendar-core"
version = "0.1.0"
description = "Core library for syncing Strava club events to ICS calendars"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "icalendar>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/club_calendar_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=club_calendar_core --cov-report=term-missing"

[tool.coverage.run]
source = ["src/club_calendar_core"]
branch = true

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",  # Protocol method stubs
]
