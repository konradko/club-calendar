[project]
name = "club-calendar-macos"
version = "0.1.0"
description = "macOS menu bar app for syncing Strava club events"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "club-calendar-core",
    "club-calendar-cli",
    "keyring>=25.0",
]

[project.optional-dependencies]
menubar = ["rumps>=0.4"]

[project.gui-scripts]
club-calendar-menubar = "club_calendar_macos.menubar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/club_calendar_macos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=club_calendar_macos --cov-report=term-missing"

[tool.coverage.run]
source = ["src/club_calendar_macos"]
branch = true

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
