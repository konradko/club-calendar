[project]
name = "club-calendar-cli"
version = "0.1.0"
description = "CLI for syncing Strava club events to ICS calendars"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "club-calendar-core",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.scripts]
club-calendar = "club_calendar_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/club_calendar_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=club_calendar_cli --cov-report=term-missing"

[tool.coverage.run]
source = ["src/club_calendar_cli"]
branch = true

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
