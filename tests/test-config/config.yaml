# Club Calendar Configuration
#
# schema_version: do not edit manually
#
# Setup:
#   1. Go to https://www.strava.com/settings/api
#   2. Create an app (any name, localhost callback URL)
#   3. Copy Client ID and Client Secret below
#   4. Save this file and click "Authenticate..." in the menu
#
# After authentication, click "Sync Now" to fetch your clubs.
# New clubs matching your cities filter are auto-enabled.

schema_version: 2

strava_client_id: mock_client_id
strava_client_secret: mock_client_secret
strava_refresh_token: mock_refresh_token  # auto-set after auth

# Sync settings
sync_interval_minutes: 0
sync_on_startup: true
sync_weeks: 8
max_events_per_club_per_week: 10  # 0 = unlimited
max_menu_events: 15  # menu display limit (0 = unlimited)

# Calendar settings
calendar_name: "Test Club Calendar"

# OAuth callback port (49152-65535 range recommended)
oauth_callback_port: 51678

# City filter - auto-enable new clubs in these cities (empty = all)
# Example:
#   cities:
#     - London
#     - Manchester
cities: []

# Clubs - populated after first sync
# You can manually enable/disable clubs here
# Example:
#   clubs:
#     123456:
#       name: Morning Runners
#       city: London
#       enabled: true
clubs: {}
