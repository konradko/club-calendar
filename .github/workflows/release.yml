name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-13
            arch: intel
            arch_suffix: x86_64
          - runner: macos-14
            arch: arm64
            arch_suffix: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Build app
        run: |
          uv run pyinstaller --clean --noconfirm deploy/ClubCalendar.spec

      - name: Create DMG
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          ARCH_SUFFIX: ${{ matrix.arch_suffix }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="ClubCalendar-${VERSION}-${ARCH_SUFFIX}.dmg"

          hdiutil create -srcfolder "dist/Club Calendar.app" \
            -volname "Club Calendar" \
            -fs HFS+ \
            -format UDZO \
            -imagekey zlib-level=9 \
            "dist/${DMG_NAME}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg

  release:
    name: Create Release
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Intel DMG
        uses: actions/download-artifact@v4
        with:
          name: dmg-intel
          path: dist/

      - name: Download ARM64 DMG
        uses: actions/download-artifact@v4
        with:
          name: dmg-arm64
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*.dmg
