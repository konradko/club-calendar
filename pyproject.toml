[project]
name = "club-calendar-workspace"
version = "0.1.0"
description = "Sync Strava club events to ICS calendar feeds - monorepo workspace"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "packages/cli", "packages/macos"]

[tool.uv.sources]
club-calendar-core = { workspace = true }
club-calendar-cli = { workspace = true }
club-calendar-macos = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.35",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "pyinstaller>=6.0",
    "rumps>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
