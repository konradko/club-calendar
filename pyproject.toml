[project]
name = "club-calendar"
version = "0.1.0"
description = "Sync Strava club events to Apple Calendar"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "club-calendar-core",
    "pyyaml>=6.0",
    "rumps>=0.4",
    "pyobjc-framework-EventKit>=10.0",
]

[project.scripts]
club-calendar = "club_calendar.menubar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/club_calendar"]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/core"]

[tool.uv.sources]
club-calendar-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.35",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "pyinstaller>=6.0",
    "pillow>=10.0",
    "watchdog>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
