name: Sync Strava Club Events

on:
  schedule:
    # Run 4 times daily at 8, 12, 16, 20 UTC
    - cron: '0 8,12,16,20 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --package club-calendar-cli

      - name: Sync calendar
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_CLUB_IDS: ${{ vars.STRAVA_CLUB_IDS }}
          CLUB_CITY_FILTER: ${{ vars.CLUB_CITY_FILTER }}
        run: |
          mkdir -p _site
          # Use CALENDAR_ID suffix if configured, otherwise plain filename
          if [ -n "${{ vars.CALENDAR_ID }}" ]; then
            OUTPUT="_site/club-calendar-${{ vars.CALENDAR_ID }}.ics"
          else
            OUTPUT="_site/club-calendar.ics"
          fi
          uv run club-calendar sync --output "_site" --stdout > "$OUTPUT"
          # Verify output file was created
          if [ ! -f "$OUTPUT" ]; then
            echo "Error: Calendar file was not created"
            exit 1
          fi
          echo "Calendar file created: $(wc -l < "$OUTPUT") lines"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
