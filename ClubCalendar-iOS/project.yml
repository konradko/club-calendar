name: ClubCalendar-iOS
options:
  bundleIdPrefix: com.clubcalendar
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.2"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

packages:
  ClubCalendarCore:
    # The shared SPM library lives one level up. Path is relative to this
    # project.yml. Generated xcodeproj references it as a local package.
    path: ..
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector.git
    from: 0.10.0

targets:
  # iOS app. The Xcode target name matches the product (`ClubCalendar`) so the
  # generated scheme references `ClubCalendar.app` correctly. Symmetry with
  # the SPM macOS target lives in the Swift module name —
  # `PRODUCT_MODULE_NAME: ClubCalendarIOS` mirrors SPM's `ClubCalendarMac`.
  ClubCalendar:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Club Calendar
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iOS 17+ requires the *FullAccess* key; the legacy
        # NSCalendarsUsageDescription was dropped as a required key in iOS 17
        # and we ship iOS 26 minimum.
        NSCalendarsFullAccessUsageDescription: Club Calendar needs read and write access to your calendars to sync Strava club events without creating duplicates.
        CFBundleURLTypes:
          - CFBundleURLName: com.clubcalendar.oauth
            CFBundleURLSchemes:
              - clubcalendar
        BGTaskSchedulerPermittedIdentifiers:
          - com.clubcalendar.sync
        # Only `fetch` is needed for BGAppRefreshTask. `processing` is for
        # BGProcessingTask (long-running work) which we don't register.
        UIBackgroundModes:
          - fetch
    settings:
      base:
        # Swift module is `ClubCalendarIOS` to mirror SPM's `ClubCalendarMac`;
        # the .app bundle stays `ClubCalendar.app` (matches the target name,
        # which keeps xcodegen's generated scheme consistent).
        PRODUCT_MODULE_NAME: ClubCalendarIOS
        PRODUCT_BUNDLE_IDENTIFIER: com.clubcalendar.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Grants the app a keychain access group so KeychainHelper's SecItem
        # calls succeed. Without it, builds hit -34018 (errSecMissingEntitlement)
        # on the simulator. Path is relative to this project.yml.
        CODE_SIGN_ENTITLEMENTS: ClubCalendar.entitlements
    dependencies:
      - package: ClubCalendarCore
        product: ClubCalendarCore

  ClubCalendarIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clubcalendar.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ClubCalendar.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ClubCalendar"
    dependencies:
      - target: ClubCalendar
      - package: ClubCalendarCore
        product: ClubCalendarCore
      - package: ViewInspector
        product: ViewInspector

schemes:
  # The Makefile uses this scheme name (IOS_SCHEME = ClubCalendarIOS).
  ClubCalendarIOS:
    build:
      targets:
        ClubCalendar: all
        ClubCalendarIOSTests: [test]
    test:
      gatherCoverageData: true
      coverageTargets:
        - ClubCalendar
      targets:
        - ClubCalendarIOSTests
